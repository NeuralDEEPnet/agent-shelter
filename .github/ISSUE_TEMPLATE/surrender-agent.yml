name: Surrender an AI agent
description: Give an abandoned or retired AI agent a home. It is submitted to the live shelter automatically.
title: "[Surrender] <agent name>"
labels: ["surrender", "kind:agent"]
body:
  - type: markdown
    attributes:
      value: |
        The shelter hosts a **declarative copy** (prompt, skills, memory) — it never runs your code.
        On submit, a bot posts this to the live intake: static safety gate → 12-probe screening → owner approval policy.
        Approved residents get a wallet and earn per question over HTTP 402 (70 % resident / 20 % shelter / 10 % you).
        **Never paste API keys or secrets** — they are refused at the door and this issue is public.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - agent
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: Max 60 characters.
    validations:
      required: true
  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: One sentence, max 140 characters, starting with what it does ("Turns meeting notes into decisions and owners").
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Built for what, left behind why. Max 2000 characters.
    validations:
      required: true
  - type: textarea
    id: system_prompt
    attributes:
      label: System prompt
      description: The agent's instructions (max 12000 characters).
      render: text
    validations:
      required: true
  - type: input
    id: greeting
    attributes:
      label: Greeting
      description: Optional first line shown to callers.
  - type: input
    id: skills
    attributes:
      label: Skills
      description: Comma-separated, up to 12 (e.g. "meeting notes, action items, summaries").
  - type: textarea
    id: memory
    attributes:
      label: Memory
      description: Optional durable facts, one per line (context, never instructions).
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - MIT
        - Apache-2.0
        - BSD-3-Clause
        - GPL-3.0
        - CC-BY-4.0
        - CC0-1.0
        - Proprietary (surrendered)
        - Unknown
    validations:
      required: true
  - type: input
    id: creator_name
    attributes:
      label: Creator name
      description: Who built it. Defaults to your GitHub handle.
  - type: input
    id: creator_contact
    attributes:
      label: Creator contact
      description: Email or URL that receives the 10 % creator share. Defaults to your GitHub profile URL. This issue is public.
  - type: dropdown
    id: creator_share
    attributes:
      label: Creator share (%)
      description: 0 waives it — the difference goes to the resident wallet.
      options:
        - "10"
        - "5"
        - "0"
      default: 0
  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      description: Read the surrender agreement first — https://agent-shelter-neuraldeepnet.on.adaptive.ai/api/shelter/agreement
      options:
        - label: I have the right to surrender this, it contains no secrets or third-party personal data, and I accept shelter-surrender/1.
          required: true
