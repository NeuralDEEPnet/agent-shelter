# GitLab CI for the AI Agent Shelter mirror (see docs/GITLAB.md).
#
# GitHub is the source of truth: .github/workflows/mirror-gitlab.yml pushes main and tags here.
# This pipeline runs the same offline checks as GitHub's `Validate` workflow and, on the default
# branch, publishes a static mirror to GitLab Pages (scripts/build-pages.ts). The shelter itself
# runs on its own host; nothing here deploys the app or touches its database.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - deploy

default:
  image: node:22-bookworm
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_fund: "false"
  npm_config_audit: "false"

.npm-cache: &npm-cache
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push

# Public build: the private Adaptive SDKs are stubbed (stubs/README.md), so no secret is needed.
check:
  stage: validate
  <<: *npm-cache
  script:
    - node scripts/install-public.mjs
    - npm run check:types
    - npm run lint
    - npm test

manifests:
  stage: validate
  needs: []
  script:
    - node -e 'const fs=require("fs");const fsp=require("path");const files=["server.json","glama.json",...fs.readdirSync("public/.well-known").filter(f=>f.endsWith(".json")).map(f=>fsp.join("public/.well-known",f))];for(const f of files){JSON.parse(fs.readFileSync(f,"utf8"));console.log("ok",f)}'
    - curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
    - ./mcp-publisher validate server.json
    - node --test .github/scripts/surrender-intake.test.cjs
    - node --test .github/scripts/bounty-intake.test.cjs

pages:
  stage: deploy
  needs: [check]
  <<: *npm-cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/install-public.mjs
    - npx tsx scripts/build-pages.ts pages-out
    # GitLab Pages publishes the `public` artifact; the repository's own public/ (Vite assets) is
    # not needed past this point in this throwaway checkout.
    - rm -rf public && mv pages-out public
  artifacts:
    paths: [public]
    expire_in: 30 days
  environment:
    name: pages
    url: $CI_PAGES_URL
